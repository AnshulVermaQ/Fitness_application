server:
  port: 9002

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/aiservice
      database: aiservice
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}


eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL}


rabbitmq:
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.tracking


gemini:
  api:
    url: {GEMINI_API_URL}
    key: ${GEMINI_API_KEY}
